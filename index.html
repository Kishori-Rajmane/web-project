<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

     <link rel="stylesheet" href="main.css"> 
  
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">FASHION-PRO</a>
            <div class="mx-auto">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Product List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
            <div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-heart"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-shopping-cart"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-user"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-title" style="background-image: url('bg.webp');">
        <div class="container">
            <h3 class="heading text-center">Shopping Cart</h3>
           
        </div>
    </div>
    <div class="container text-center mt-5">
        <h4 class="you-may-like">You May Also Like</h4>
    </div>
       <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="searchBar" class="form-control" placeholder="Search products...">
            </div>
           
        </div>
        <div class="row">
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="sortOptions" class="form-label">Sort By</label>
                    <select id="sortOptions" class="form-select">
                        <option value="all">All</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="filterCategory" class="form-label">Category</label>
                    <select id="filterCategory" class="form-select">
                        <option value="all">All Categories</option>
                        <option value="T shirt">T shirt</option>
                        <option value="Top">Top</option>
                        <option value="Jaket">Jaket</option>
                        <option value="Men">Men</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="minPrice" class="form-label">Min Price</label>
                    <input type="number" id="minPrice" class="form-control" placeholder="Min Price">
                </div>
                <div class="mb-3">
                    <label for="maxPrice" class="form-label">Max Price</label>
                    <input type="number" id="maxPrice" class="form-control" placeholder="Max Price">
                </div>
                <div class="mb-3">
                    <label for="filterRating" class="form-label">Rating</label>
                    <select id="filterRating" class="form-select">
                        <option value="all">All Ratings</option>
                        <option value="5">5 Stars</option>
                        <option value="4">4 Stars & Up</option>
                        <option value="3">3 Stars & Up</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="filterAvailability" class="form-label">Availability</label>
                    <select id="filterAvailability" class="form-select">
                        <option value="all">All</option>
                        <option value="in-stock">In Stock</option>
                        <option value="out-of-stock">Out of Stock</option>
                    </select>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row" id="productContainer"></div>
                <div class="pagination mt-4 d-flex justify-content-center" id="pagination"></div>
            </div>
        </div>
    </div>
    </div>
    <script src="main.js">
    
    </script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>
